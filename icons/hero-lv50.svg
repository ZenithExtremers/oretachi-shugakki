<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 主人公スキン Lv.50「レッドスーツ」：手描きのふぞろいな形・なめらかな線。ふち線は黒 -->
  <defs>
    <clipPath id="c"><circle cx="256" cy="256" r="220"/></clipPath>
    <!-- 線はなめらかなまま、形だけ手描きっぽくゆがませる（いつものアイコンと同じ感じ） -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="1" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#1e3a8a"/>
  <circle cx="256" cy="256" r="220" fill="#fff"/>
  <g clip-path="url(#c)"><g filter="url(#rough)" stroke="#111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 赤いスーツ（左右ふぞろい） -->
    <path d="M14 520 Q30 404 128 384 L204 352 L252 486 L310 350 L396 378 Q478 400 498 520 Z" fill="#f50f1e"/>
    <!-- 黒いシャツ -->
    <path d="M200 356 L252 486 L312 352 L290 332 L222 336 Z" fill="#111"/>
    <!-- えり（濃い赤） -->
    <path d="M204 352 L166 396 L196 412 L174 440 L242 512 Z" fill="#d20c18"/>
    <path d="M310 350 L346 388 L318 410 L338 432 L268 512 Z" fill="#d20c18"/>
    <!-- 赤いネクタイ -->
    <path d="M238 354 L272 358 L262 380 L282 468 L254 508 L230 466 L248 380 Z" fill="#f81c28"/>
    <!-- 首 -->
    <path d="M216 282 L212 342 Q252 366 300 340 L296 282 Z" fill="#e3c3b2"/>
    <!-- 顔（ちょっと面長・左右ふぞろい） -->
    <path d="M158 196 Q152 320 250 346 Q350 322 354 192 Z" fill="#e8cabb"/>
    <path d="M354 222 Q372 236 366 262 Q360 280 350 274" fill="#e3c0ae"/>
    <!-- マッシュの髪：ぼてっとした丸い形 -->
    <path d="M136 226 Q116 96 218 64 Q262 50 304 64 Q396 92 378 220 Q372 236 352 232 L160 238 Q142 238 136 226 Z" fill="#5c4129"/>
    <!-- 黒いサングラス（上が広い） -->
    <path d="M160 232 L250 230 L240 284 Q236 294 222 294 L192 292 Q176 290 172 278 Z" fill="#050505"/>
    <path d="M262 232 L352 228 L340 280 Q334 294 318 292 L286 294 Q272 292 270 282 Z" fill="#050505"/>
    <path d="M248 240 Q256 236 264 240" fill="none"/>
    <path d="M160 236 L146 244 M352 232 L364 240" fill="none"/>
    <!-- 鼻（うすい線） -->
    <path d="M248 296 Q244 304 252 306" fill="none" stroke="#d9b3a2" stroke-width="4"/>
    <!-- 口（ピンクのくちびる＋こげ茶の線） -->
    <path d="M226 318 Q252 306 282 318 Q254 332 226 318 Z" fill="#d6a2a8" stroke="none"/>
    <path d="M228 318 Q254 322 280 316" fill="none" stroke="#5a0f0f" stroke-width="3"/>
  </g></g>
</svg>
